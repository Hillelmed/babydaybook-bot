version: '3.8'
services:
  app:
    build: .
    container_name: baby-care-bot-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      - db

  db:
    image: mongo:6.0
    container_name: baby-care-bot-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: babytracker
    volumes:
      - mongodata:/data/db
    ports:
      - '27017:27017'

volumes:
  mongodata:
